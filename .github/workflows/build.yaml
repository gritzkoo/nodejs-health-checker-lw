name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: repo clone
        uses: actions/checkout@v4
      - name: setup node version
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: build
        run: |
          npm install --legacy-peer-deps
          npm run build

